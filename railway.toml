# Railway config-as-code. Schema: https://railway.com/railway.schema.json

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Runs in the built image before the new container starts.
# 1. prisma migrate deploy  -> creates/updates tables. Without this the Railway
#    Postgres is empty and every /club command fails at runtime.
# 2. deploy-commands        -> registers slash commands. index.ts never does this,
#    so without it the bot connects but has no commands.
preDeployCommand = ["npx prisma migrate deploy && node dist/deploy-commands.js"]

startCommand = "node dist/index.js"

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
