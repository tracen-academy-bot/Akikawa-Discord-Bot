<title>Tracen Roster Dossier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky roster rail on the left, dossier sheet on the right; tabs swap the sheet for the graph or the groups board. Stacks to one column on phones. */
:root {
  /* Dark-first: the owner asked for dark. Light only on an explicit light choice. */
  --bg: #111613; --sheet: #182019; --ink: #e5ece7; --muted: #9aa8a0; --line: #2a352f;
  --turf: #5cc492; --turf-soft: #1d3127; --rose: #ef7fa2; --rose-soft: #3a2029; --warn: #e3b341;
  --band: #143b28; --band-ink: #e8f6ee;
  --display: "Dela Gothic One", "Zen Kaku Gothic New", system-ui, sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f3f5f1; --sheet: #ffffff; --ink: #1c2420; --muted: #5d6a63; --line: #d9dfd9;
  --turf: #1f6b47; --turf-soft: #e2efe7; --rose: #c2416b; --rose-soft: #f8e4ea; --warn: #9a6a00;
  --band: #1f6b47; --band-ink: #f4fbf6; color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--band); color: var(--band-ink); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding-block: 10px; }
header.top h1 { font-family: var(--display); font-weight: 400; font-size: 20px; margin: 0; letter-spacing: .02em; }
header.top .count { font-family: var(--mono); font-size: 12px; opacity: .85; }
nav.tabs { display: flex; gap: 4px; margin-left: auto; }
nav.tabs button { background: transparent; border: 1px solid var(--turf-soft); color: var(--band-ink); border-radius: 999px; padding: 3px 14px; cursor: pointer; font-size: 13px; }
nav.tabs button[aria-selected="true"] { background: var(--turf); color: var(--bg); border-color: var(--turf); }

main { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; padding-block: 18px 40px; max-width: 1280px; margin: 0 auto; }
@media (max-width: 820px) { main { grid-template-columns: minmax(0, 1fr); } }

.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); align-self: start; display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 90px); }
@media (max-width: 820px) { .rail { position: static; max-height: none; } }
.filters { display: flex; flex-direction: column; gap: 8px; }
.filters input, .filters select { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--sheet); }
.filters .row { display: flex; gap: 8px; }
.filters .row > * { flex: 1; min-width: 0; }
.list { overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--sheet); min-height: 200px; }
@media (max-width: 820px) { .list { max-height: 260px; } }
.list button { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 7px 12px; border: 0; border-bottom: 1px solid var(--line); background: transparent; cursor: pointer; }
.list button:hover { background: var(--turf-soft); }
.list button[aria-current="true"] { background: var(--rose-soft); }
.list .dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--line); }
.list .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .nm small { color: var(--muted); margin-left: 6px; }
.list .tag { font-family: var(--mono); font-size: 11px; color: var(--muted); }

.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 22px clamp(16px, 3vw, 30px); min-width: 0; }
.hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: start; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.swatch { width: 56px; height: 56px; border-radius: 14px; border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--display); font-size: 24px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
.hero h2 { font-family: var(--display); font-weight: 400; font-size: clamp(22px, 3.2vw, 30px); line-height: 1.2; margin: 0; text-wrap: balance; }
.hero .jp { color: var(--muted); font-size: 15px; margin-left: 8px; font-family: var(--body); }
.hero p.one { margin: 6px 0 0; font-size: 16px; max-width: 65ch; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--turf-soft); color: var(--turf); white-space: nowrap; }
.chip.rose { background: var(--rose-soft); color: var(--rose); }
.chip.warn { background: transparent; border: 1px solid var(--warn); color: var(--warn); }

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px 28px; margin-top: 18px; }
section.block { min-width: 0; }
section.block h3 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 700; }
section.block p { margin: 0 0 8px; max-width: 70ch; }
dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 0; }
dl.kv dt { color: var(--muted); font-size: 13px; }
dl.kv dd { margin: 0; min-width: 0; }
ul.plain { margin: 0; padding-left: 18px; }
ul.plain li { margin-bottom: 4px; }
.tics { display: flex; flex-direction: column; gap: 6px; }
.tic { display: grid; grid-template-columns: minmax(0, 1fr); }
.tic b { font-weight: 700; }
.tic span { color: var(--muted); font-size: 13px; }
.rel { display: flex; flex-direction: column; gap: 8px; }
.rel .r { border-left: 3px solid var(--turf); padding-left: 10px; }
.rel .r.unv { border-left-color: var(--warn); }
.rel a { color: var(--turf); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.rel .ev { font-size: 12px; color: var(--muted); font-family: var(--mono); overflow-wrap: anywhere; }
.line { padding: 10px 12px; border-radius: 10px; background: var(--bg); margin-bottom: 8px; }
.line .j { font-size: 14px; white-space: pre-line; }
.line .e { font-size: 14px; color: var(--muted); margin-top: 4px; }
.line .id { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.timer { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 12px; border: 1px dashed var(--rose); border-radius: 10px; margin-bottom: 8px; }
.timer code { font-family: var(--body); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.copy { border: 1px solid var(--line); background: var(--sheet); border-radius: 6px; padding: 2px 10px; cursor: pointer; font-size: 12px; }
details { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 14px; }
details summary { cursor: pointer; font-weight: 700; font-size: 14px; }
details .cols { columns: 2 260px; column-gap: 24px; margin-top: 8px; font-size: 14px; }
details .cols div { break-inside: avoid; margin-bottom: 3px; }
.vfilter { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.vfilter button { border: 1px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 1px 10px; font-size: 12px; cursor: pointer; }
.vfilter button[aria-pressed="true"] { background: var(--turf); color: var(--sheet); border-color: var(--turf); }
.vlist { max-height: 420px; overflow-y: auto; font-size: 14px; }
.vlist div { padding: 6px 0; border-bottom: 1px solid var(--line); white-space: pre-line; }
.vlist .id { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-right: 8px; }
.gaps { color: var(--warn); font-size: 13px; }
.src { font-size: 12px; color: var(--muted); font-family: var(--mono); overflow-wrap: anywhere; }

.full { grid-column: 1 / -1; }
#graphView .sheet { padding: 14px; }
.graphbar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; font-size: 13px; margin-bottom: 10px; }
.graphbar label { display: flex; gap: 6px; align-items: center; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
.canvasbox { width: 100%; overflow: hidden; border-radius: 10px; background: var(--bg); }
canvas { display: block; width: 100%; height: auto; touch-action: none; cursor: pointer; }
#graphInfo { margin-top: 10px; font-size: 14px; min-height: 2em; }

.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.group { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: var(--sheet); min-width: 0; }
.group h4 { margin: 0; font-size: 16px; }
.group .kind { font-family: var(--mono); font-size: 11px; color: var(--rose); text-transform: uppercase; letter-spacing: .08em; }
.group .mem { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
.group .mem a { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--turf-soft); color: var(--turf); cursor: pointer; }
.group p { margin: 4px 0; font-size: 14px; }
.group .basis { font-size: 12px; color: var(--muted); }
.next { margin-bottom: 18px; }
.note { font-size: 13px; color: var(--muted); max-width: 75ch; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top"><div class="wrap">
  <h1>Tracen Roster Dossier</h1>
  <span class="count" id="count">loading</span>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-roster" aria-selected="true">Roster</button>
    <button role="tab" id="tab-graph" aria-selected="false">Who talks to whom</button>
    <button role="tab" id="tab-groups" aria-selected="false">Groups and sets</button>
  </nav>
</div></header>

<div class="wrap">
<main id="rosterView">
  <aside class="rail">
    <div class="filters">
      <input id="q" type="search" placeholder="Search name, tic, motif, line..." aria-label="Search">
      <div class="row">
        <select id="fDorm" aria-label="Dorm"><option value="">Any dorm</option></select>
        <select id="fKind" aria-label="Kind">
          <option value="">Everyone</option><option value="playable">Playable umas</option>
          <option value="uma">All umas</option><option value="npc">NPCs</option>
        </select>
      </div>
      <select id="fGroup" aria-label="Group"><option value="">Any group</option></select>
    </div>
    <div class="list" id="list" role="list"></div>
  </aside>
  <article class="sheet" id="sheet" aria-live="polite"></article>
</main>

<main id="graphView" hidden>
  <div class="sheet full">
    <div class="graphbar">
      <label>Edges <select id="gMode">
        <option value="home">Home-screen conversations</option>
        <option value="mention">Name drops in voice lines</option>
      </select></label>
      <label>Min weight <input id="gMin" type="range" min="1" max="6" value="2" style="width:110px"><span id="gMinV">2</span></label>
      <span class="legend" id="legend"></span>
    </div>
    <div class="canvasbox"><canvas id="cv" width="1200" height="860"></canvas></div>
    <div id="graphInfo" class="note">Tap a node to see who she shares scenes with. Double-tap opens her dossier.</div>
  </div>
</main>

<main id="groupsView" hidden>
  <div class="full" id="groupsBox"></div>
</main>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let DATA = null, BY = new Map(), current = null;
const DORM_COLORS = {};
const SCENES = { home: 'Home', training: 'Training', race_result: 'Race result', live: 'Live', outing_or_misc: 'Outings / misc', race_or_team: 'Race / team', minigame: 'Minigame', team_race: 'Team race', title: 'Title' };

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

fetch('uma-data.json').then((r) => r.json()).then((d) => {
  DATA = d;
  d.charas.forEach((c) => BY.set(c.id, c));
  $('#count').textContent = `${d.charas.length} characters · JP master.mdb, ${d.meta.source_date}`;
  const dorms = [...new Set(d.charas.map((c) => c.profile_en_dorm).filter(Boolean))];
  const palette = ['var(--turf)', 'var(--rose)', 'var(--warn)', 'var(--muted)'];
  dorms.forEach((x, i) => { DORM_COLORS[x] = palette[i % palette.length]; $('#fDorm').insertAdjacentHTML('beforeend', `<option>${esc(x)}</option>`); });
  const groups = [...new Set(d.charas.flatMap((c) => c.groups || []))].sort();
  groups.forEach((g) => $('#fGroup').insertAdjacentHTML('beforeend', `<option>${esc(g)}</option>`));
  renderList();
  const fromHash = Number(location.hash.replace('#u', ''));
  const saved = Number(store('uma-current'));
  show(BY.get(fromHash) || BY.get(saved) || d.charas[0]);
  buildGraph(); renderGroups();
}).catch((e) => { $('#sheet').innerHTML = `<p>Could not load the data file (${esc(e.message)}). Reload the page to try again.</p>`; });

function matches(c, q) {
  if (!q) return true;
  const hay = [c.name_en, c.name_jp, c.one_liner, c.personality, (c.likes_and_motifs || []).join(' '),
    (c.speech?.tics || []).map((t) => t.jp + ' ' + t.romaji + ' ' + t.meaning).join(' '), (c.groups || []).join(' '),
    (c.voice_lines || []).map((v) => v.text).join(' ')].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).every((w) => hay.includes(w));
}
function renderList() {
  const q = $('#q').value.trim(), dorm = $('#fDorm').value, kind = $('#fKind').value, grp = $('#fGroup').value;
  const rows = DATA.charas.filter((c) => (!dorm || c.profile_en_dorm === dorm)
    && (!kind || (kind === 'playable' ? c.playable : c.kind === kind))
    && (!grp || (c.groups || []).includes(grp)) && matches(c, q));
  $('#list').innerHTML = rows.map((c) => `<button role="listitem" data-id="${c.id}" ${current && current.id === c.id ? 'aria-current="true"' : ''}>
    <span class="dot" style="background:${esc(c.image_color ? '#' + c.image_color : 'transparent')}"></span>
    <span class="nm">${esc(c.name_en)}<small>${esc(c.name_jp)}</small></span>
    <span class="tag">${c.voice_count}</span></button>`).join('') || '<p class="note" style="padding:12px">No one matches. Clear a filter to see more.</p>';
}
['#q', '#fDorm', '#fKind', '#fGroup'].forEach((s) => $(s).addEventListener('input', renderList));
$('#list').addEventListener('click', (e) => { const b = e.target.closest('button[data-id]'); if (b) show(BY.get(Number(b.dataset.id))); });

function link(id, label) { return BY.has(id) ? `<a data-go="${id}">${esc(label)}</a>` : esc(label); }
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-go]'); if (a) { setTab('roster'); show(BY.get(Number(a.dataset.go))); }
  const cp = e.target.closest('.copy');
  if (cp) {
    const txt = cp.previousElementSibling.textContent;
    navigator.clipboard.writeText(txt).then(() => { cp.textContent = 'Copied'; setTimeout(() => (cp.textContent = 'Copy'), 1200); })
      .catch(() => { const r = document.createRange(); r.selectNodeContents(cp.previousElementSibling); const s = getSelection(); s.removeAllRanges(); s.addRange(r); });
  }
});

let vScene = '';
function show(c) {
  if (!c) return;
  current = c; store('uma-current', String(c.id));
  history.replaceState(null, '', '#u' + c.id);
  renderList();
  const sp = c.speech || {};
  const p = Object.assign({}, c.raw_profile || {}, c.profile || {});
  const initial = (c.name_en || c.name_jp || '?').trim()[0];
  const unverified = (s) => /unverified|general knowledge|model knowledge/i.test(s || '');
  $('#sheet').innerHTML = `
  <div class="hero">
    <div class="swatch" style="background:${esc(c.image_color ? '#' + c.image_color : 'var(--muted)')}">${esc(initial)}</div>
    <div style="min-width:0">
      <h2>${esc(c.name_en)}<span class="jp">${esc(c.name_jp)}</span></h2>
      <p class="one">${esc(c.one_liner || '')}</p>
      <div class="chips">
        ${c.playable ? '<span class="chip">Playable</span>' : `<span class="chip warn">${c.kind === 'npc' ? 'NPC' : 'Not playable yet'}</span>`}
        ${(c.groups || []).map((g) => `<span class="chip rose">${esc(g)}</span>`).join('')}
        ${c.cards?.length ? `<span class="chip">${c.cards.length} outfit${c.cards.length > 1 ? 's' : ''}</span>` : ''}
        <span class="chip">${c.voice_count} voice lines</span>
        <span class="chip">${c.event_count} event titles</span>
      </div>
    </div>
  </div>
  <div class="grid2">
    <section class="block"><h3>Personality</h3><p>${esc(c.personality || '')}</p>
      ${c.story_arc?.summary ? `<h3 style="margin-top:14px">Story arc</h3><p>${esc(c.story_arc.summary)}</p><div class="src">source: ${esc(c.story_arc.source)}</div>` : ''}</section>
    <section class="block"><h3>How she talks</h3>
      <dl class="kv"><dt>Says "I" as</dt><dd>${esc(sp.first_person)}</dd><dt>Calls you</dt><dd>${esc(sp.calls_trainer)}</dd><dt>Register</dt><dd>${esc(sp.register)}</dd></dl>
      <div class="tics" style="margin-top:10px">${(sp.tics || []).map((t) => `<div class="tic"><b>${esc(t.jp)} <span>${esc(t.romaji)}</span></b><span>${esc(t.meaning)}</span></div>`).join('')}</div>
    </section>
    <section class="block"><h3>Profile</h3><dl class="kv">
      ${['dorm', 'grade', 'birthday', 'height', 'voice_actor'].map((k) => p[k] ? `<dt>${k.replace('_', ' ')}</dt><dd>${esc(p[k])}</dd>` : '').join('')}
      ${c.cards?.[0]?.aptitudes ? `<dt>aptitudes</dt><dd class="src">${esc(Object.entries(c.cards[0].aptitudes).map(([k, v]) => k + ' ' + v).join(' · '))}</dd>` : ''}
    </dl>
      <h3 style="margin-top:14px">Likes and motifs</h3><ul class="plain">${(c.likes_and_motifs || []).map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
      <h3 style="margin-top:14px">Weak spots</h3><ul class="plain">${(c.weak_spots || []).map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
    </section>
    <section class="block"><h3>Relationships</h3><div class="rel">
      ${(c.relationships || []).map((r) => `<div class="r ${unverified(r.evidence) ? 'unv' : ''}">${r.id ? link(r.id, r.name_en) : esc(r.name_en)} - ${esc(r.nature)}<div class="ev">${esc(r.evidence)}</div></div>`).join('') || '<p class="note">None recorded.</p>'}
    </div><p class="note" style="margin-top:8px">Green edge: backed by game data. Amber edge: outside knowledge, unverified.</p></section>
  </div>
  <div class="grid2">
    <section class="block"><h3>Lines that show her voice</h3>
      ${(c.sample_lines || []).map((l) => `<div class="line"><div class="j">${esc(l.jp)}</div><div class="e">${esc(l.en)}</div><div class="id">voice ${esc(l.voice_id)}</div></div>`).join('') || '<p class="note">No voiced lines in the data.</p>'}</section>
    <section class="block"><h3>Timer special drafts</h3>
      ${(c.timer_line_ideas || []).map((t) => `<div class="timer"><code>${esc(t)}</code><button class="copy" type="button">Copy</button></div>`).join('')}
      <p class="note">Drafts in the Set 1 style. Edit before use; staff wording wins.</p>
      ${c.data_gaps?.length ? `<h3 style="margin-top:14px">Gaps and doubts</h3><ul class="plain gaps">${c.data_gaps.map((g) => `<li>${esc(g)}</li>`).join('')}</ul>` : ''}
    </section>
  </div>
  <details><summary>Shares scenes with (game data)</summary><div class="cols">
    ${(c.home_scene_partners || []).map((x) => `<div>${link(x.id, BY.get(x.id)?.name_en || x.name)} <span class="src">home x${x.count}</span></div>`).join('') || '<div class="note">No home-screen scenes.</div>'}
    ${(c.mentions_in_voice || []).map((x) => `<div>names ${link(x.id, BY.get(x.id)?.name_en || x.name)} <span class="src">x${x.count}</span></div>`).join('')}
    ${(c.mentioned_by || []).map((x) => `<div>named by ${link(x.id, BY.get(x.id)?.name_en || x.name)} <span class="src">x${x.count}</span></div>`).join('')}
  </div></details>
  <details><summary>Event titles (${c.event_count}, Japanese)</summary><div class="cols">
    ${(c.chara_story_titles || []).map((t) => `<div>Story: ${esc(t)}</div>`).join('')}
    ${(c.trainee_event_titles || []).map((t) => `<div>${esc(t)}</div>`).join('')}
    ${(c.support_event_titles || []).map((t) => `<div>Support: ${esc(t)}</div>`).join('')}
  </div></details>
  <details><summary>All voice lines (${c.voice_count}, Japanese)</summary>
    <div class="vfilter" id="vf"></div><div class="vlist" id="vl"></div></details>
  <details><summary>Raw profile fields (Japanese)</summary><dl class="kv" style="margin-top:8px">
    ${Object.entries(c.raw_profile || {}).filter(([, v]) => v && (!Array.isArray(v) || v.length)).map(([k, v]) => `<dt>${esc(k)}</dt><dd style="white-space:pre-line">${esc(Array.isArray(v) ? v.join('\n') : v)}</dd>`).join('')}
  </dl></details>`;
  vScene = '';
  renderVoices();
  if (matchMedia('(max-width: 820px)').matches) $('#sheet').scrollIntoView({ block: 'start' });
}
function renderVoices() {
  const c = current; const scenes = [...new Set((c.voice_lines || []).map((v) => v.scene))];
  $('#vf').innerHTML = ['', ...scenes].map((s) => `<button type="button" data-s="${esc(s)}" aria-pressed="${s === vScene}">${esc(s === '' ? 'All' : SCENES[s] || s)}</button>`).join('');
  $('#vl').innerHTML = (c.voice_lines || []).filter((v) => !vScene || v.scene === vScene).map((v) => `<div><span class="id">${v.voice_id}</span>${esc(v.text)}</div>`).join('') || '<div class="note">None.</div>';
}
document.addEventListener('click', (e) => { const b = e.target.closest('#vf button'); if (b) { vScene = b.dataset.s; renderVoices(); } });

function setTab(t) {
  ['roster', 'graph', 'groups'].forEach((x) => { $('#tab-' + x).setAttribute('aria-selected', String(x === t)); $('#' + x + 'View').hidden = x !== t; });
  store('uma-tab', t);
  if (t === 'graph') drawGraph();
}
['roster', 'graph', 'groups'].forEach((x) => $('#tab-' + x).addEventListener('click', () => setTab(x)));

/* ---------- graph: force layout computed once, drawn on canvas ---------- */
let G = { nodes: [], edges: [], sel: null };
function edgeWeight(e, mode) { return mode === 'home' ? e.home : e.mention_ab + e.mention_ba; }
function buildGraph() {
  const mode = $('#gMode').value, min = Number($('#gMin').value);
  $('#gMinV').textContent = min;
  const edges = DATA.edges.filter((e) => edgeWeight(e, mode) >= min && BY.has(e.a) && BY.has(e.b));
  const ids = new Set(edges.flatMap((e) => [e.a, e.b]));
  const W = 1200, H = 860;
  const old = new Map(G.nodes.map((n) => [n.id, n]));
  const nodes = [...ids].map((id, i) => old.get(id) || { id, x: W / 2 + 300 * Math.cos(i * 2.4) * Math.sqrt(i / ids.size), y: H / 2 + 260 * Math.sin(i * 2.4) * Math.sqrt(i / ids.size) });
  const idx = new Map(nodes.map((n, i) => [n.id, i]));
  nodes.forEach((n) => { n.deg = 0; });
  const E = edges.map((e) => ({ s: idx.get(e.a), t: idx.get(e.b), w: edgeWeight(e, mode) }));
  E.forEach((e) => { nodes[e.s].deg += e.w; nodes[e.t].deg += e.w; });
  for (let it = 0; it < 400; it++) {
    const k = 1 - it / 400;
    for (const n of nodes) { n.vx = 0; n.vy = 0; }
    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j]; const dx = a.x - b.x, dy = a.y - b.y; const d2 = dx * dx + dy * dy + 1;
      if (d2 > 160000) continue; const f = 70 / d2; a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
    }
    for (const e of E) {
      const a = nodes[e.s], b = nodes[e.t]; const dx = b.x - a.x, dy = b.y - a.y; const d = Math.sqrt(dx * dx + dy * dy) + 0.01;
      const f = (d - 55) * 0.03 * Math.min(3, e.w) / d; a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
    }
    for (const n of nodes) {
      n.vx += (W / 2 - n.x) * 0.02; n.vy += (H / 2 - n.y) * 0.026;
      n.x += Math.max(-15, Math.min(15, n.vx)) * k; n.y += Math.max(-15, Math.min(15, n.vy)) * k;
      n.x = Math.max(30, Math.min(W - 120, n.x)); n.y = Math.max(24, Math.min(H - 24, n.y));
    }
  }
  const ranked = [...nodes].sort((a, b) => b.deg - a.deg); ranked.forEach((n, i) => { n.top = i < 24; });
  G = { nodes, edges: E, sel: G.sel };
  $('#legend').innerHTML = Object.entries(DORM_COLORS).map(([k]) => `<span><i style="background:${dormColor(k)}"></i>${esc(k)}</span>`).join('') + `<span><i style="background:${css('--line')}"></i>Other</span>`;
  drawGraph();
}
function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function dormColor(d) { const m = DORM_COLORS[d]; return m ? css(m.slice(4, -1)) : css('--line'); }
function drawGraph() {
  const cv = $('#cv'); if (!cv || $('#graphView').hidden) return;
  const ctx = cv.getContext('2d'); ctx.clearRect(0, 0, cv.width, cv.height);
  const sel = G.sel; const near = new Set();
  if (sel != null) G.edges.forEach((e) => { if (e.s === sel) near.add(e.t); if (e.t === sel) near.add(e.s); });
  const ink = css('--ink'), muted = css('--muted'), rose = css('--rose'), line = css('--line');
  G.edges.forEach((e) => {
    const a = G.nodes[e.s], b = G.nodes[e.t]; const on = sel != null && (e.s === sel || e.t === sel);
    ctx.strokeStyle = on ? rose : line; ctx.globalAlpha = sel != null && !on ? 0.25 : 0.9; ctx.lineWidth = on ? 1 + e.w : Math.min(4, 0.6 + e.w * 0.4);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  });
  ctx.globalAlpha = 1;
  G.nodes.forEach((n, i) => {
    const c = BY.get(n.id); const r = 4 + Math.sqrt(n.deg) * 1.6; const dim = sel != null && i !== sel && !near.has(i);
    ctx.globalAlpha = dim ? 0.3 : 1; ctx.fillStyle = dormColor(c.profile_en_dorm); ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI * 2); ctx.fill();
    if (i === sel) { ctx.strokeStyle = rose; ctx.lineWidth = 3; ctx.stroke(); }
    if (!dim && ((sel == null && n.top) || i === sel || near.has(i))) { ctx.fillStyle = i === sel ? rose : ink; ctx.font = `${i === sel ? 700 : 500} 13px ${css('--body')}`; ctx.fillText(c.name_en, n.x + r + 3, n.y + 4); }
  });
  ctx.globalAlpha = 1; ctx.fillStyle = muted;
}
function pick(ev) {
  const cv = $('#cv'); const rect = cv.getBoundingClientRect();
  const x = (ev.clientX - rect.left) * cv.width / rect.width, y = (ev.clientY - rect.top) * cv.height / rect.height;
  let best = null, bd = 400; G.nodes.forEach((n, i) => { const d = (n.x - x) ** 2 + (n.y - y) ** 2; if (d < bd) { bd = d; best = i; } }); return best;
}
$('#cv').addEventListener('click', (ev) => {
  const i = pick(ev); G.sel = i; drawGraph();
  if (i == null) { $('#graphInfo').textContent = 'Tap a node to see who she shares scenes with. Double-tap opens her dossier.'; return; }
  const c = BY.get(G.nodes[i].id);
  const ps = G.edges.filter((e) => e.s === i || e.t === i).map((e) => ({ id: G.nodes[e.s === i ? e.t : e.s].id, w: e.w })).sort((a, b) => b.w - a.w);
  $('#graphInfo').innerHTML = `<b>${link(c.id, c.name_en)}</b>: ${ps.map((p) => `${link(p.id, BY.get(p.id).name_en)} <span class="src">x${p.w}</span>`).join(', ')}`;
});
$('#cv').addEventListener('dblclick', (ev) => { const i = pick(ev); if (i != null) { setTab('roster'); show(BY.get(G.nodes[i].id)); } });
$('#gMode').addEventListener('input', () => { G.sel = null; buildGraph(); });
$('#gMin').addEventListener('input', () => { G.sel = null; buildGraph(); });
new MutationObserver(drawGraph).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* ---------- groups board ---------- */
function renderGroups() {
  const g = DATA.groups || {};
  const mem = (ids) => ids.map((m) => { const id = typeof m === 'object' ? m.id : m; return `<a data-go="${id}">${esc(BY.get(id)?.name_en || m.name_en || id)}</a>`; }).join('');
  $('#groupsBox').innerHTML = `
    ${(g.suggested_next_sets || []).length ? `<div class="sheet next"><h2 style="font-family:var(--display);font-weight:400;margin:0 0 10px">Suggested next sets</h2><div class="groups">
      ${g.suggested_next_sets.map((s) => `<div class="group"><h4>${esc(s.name)}</h4><div class="mem">${mem(s.member_ids || [])}</div><p>${esc(s.why)}</p></div>`).join('')}</div></div>` : ''}
    <div class="groups">${(g.groups || []).map((x) => `<div class="group"><div class="kind">${esc(x.kind)}</div><h4>${esc(x.name)}</h4><div class="mem">${mem(x.members || [])}</div><p>${esc(x.set_pitch)}</p><div class="basis">basis: ${esc(x.basis)}</div></div>`).join('')}</div>
    ${g.coverage_note ? `<p class="note" style="margin-top:14px">${esc(g.coverage_note)}</p>` : ''}`;
}
const savedTab = store('uma-tab'); if (savedTab && savedTab !== 'roster') setTimeout(() => setTab(savedTab), 0);
</script>
