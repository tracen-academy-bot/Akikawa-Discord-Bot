services:
  bot:
    build: .
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: botpass
      POSTGRES_DB: tracen_academy
    ports:
    - "5432:5432"
    volumes:
    - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
    - "6379:6379"

volumes:
  pgdata: