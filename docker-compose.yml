services:
  bot:
    build: .
    env_file:
      - .env
    depends_on:
      postgres:
        # Wait for Postgres to actually accept connections, not merely to have
        # been created. Without this the bot races the database on first boot.
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: botpass
      POSTGRES_DB: tracen_academy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d tracen_academy"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
    - "5432:5432"
    volumes:
    - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
    - "6379:6379"

volumes:
  pgdata:
